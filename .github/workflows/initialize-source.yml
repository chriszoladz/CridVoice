name: Initialize reviewed CridVoice source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'chriszoladz/CridVoice' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified source and development history
        shell: bash
        run: |
          set -euo pipefail
          echo 'd61c1f04120f818334769720c51b05e35a6716235b30e953abe339c710fc4782  CridVoice-source-0.1.20.bundle' | sha256sum --check
          git bundle verify CridVoice-source-0.1.20.bundle
          git fetch ./CridVoice-source-0.1.20.bundle refs/heads/master:refs/remotes/imported/source
          test "$(git rev-parse refs/remotes/imported/source)" = c6ab033c308d0f74ae53579c575cd473aa85905a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit --allow-unrelated-histories refs/remotes/imported/source
          git rm -- CridVoice-source-0.1.20.bundle
          test "$(git diff --cached --name-only c6ab033c308d0f74ae53579c575cd473aa85905a)" = .github/workflows/initialize-source.yml
          git diff --cached --exit-code HEAD -- .github/workflows
          git commit -m 'Publish CridVoice 0.1.20 source and preserve development history'
          git push origin HEAD:main
